name: Run Javascript

on:
  push:
    branches:
      - master

jobs:
  run-js:
    runs-on: ubuntu-latest

    env:
      NAME: ${{ secrets.MY_NAME }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read Secret
        run: echo "Hello $NAME"

      - name: Run Node App
        run: node index.js
